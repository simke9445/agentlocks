name: Bundle conformance

# Proves the Node-bundle package contract (Option 1, bundle-size reduction): ONE ~157 KB
# dist/agentlocks.mjs, run under the user's Node, REPLACES the 7 embedded-Bun per-platform
# binaries (60-112 MB). The pack job builds + packs exactly the tarball `npm publish` would
# upload; the conformance jobs install it (`npm i -g`, no Bun on the machine) and run the
# EXTENDED conformance scenario + the `.ts`-config engine contract across every target OS/libc
# and on the MINIMUM supported Node (22.18.0). This closes the gates that block convergence:
# Windows cmd-shim + .mjs exec, alpine-musl, linux-glibc, macOS, and min-node type-stripping.
#
# RAILS: install + behavior proof ONLY. No npm publish, no tag, no `latest` flip. ci.yml triggers
# on main/PR only, so a push to shrink-bundle-size runs just this workflow.
on:
  push:
    branches: [shrink-bundle-size]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build + pack the single tarball ONCE; every conformance leg consumes this same artifact, so
  # they all prove the exact bytes a release would ship (not a per-leg rebuild).
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `npm pack` runs the prepack hook (`bun run build` -> dist/agentlocks.mjs), then tars the
      # `files` allowlist. This is the exact artifact `npm publish` would upload, so installing it
      # below proves the published package end to end.
      - name: Pack the tarball
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentlocks-tarball
          path: agentlocks-*.tgz
          if-no-files-found: error
          retention-days: 1

  # Native OS x Node matrix. Installs the tarball globally (no Bun present) and runs the extended
  # conformance scenario + the .ts-config contract against the INSTALLED bin shim. node 22.18.0 is
  # the declared engines floor (first release with unflagged type-stripping); 24.16.0 mirrors the
  # release pin. fail-fast off so one red leg never hides another's result.
  install-conformance:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.18.0", "24.16.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentlocks-tarball

      # POSIX: `npm i -g --prefix` puts the bin at <prefix>/bin/agentlocks, a symlink whose
      # `#!/usr/bin/env node` shebang runs the bundle. No Bun on PATH -> proves the pure-Node path.
      - name: Install + conformance (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/al-prefix"
          mkdir -p "$PREFIX"
          npm i -g --prefix "$PREFIX" "$PWD"/agentlocks-*.tgz
          BIN="$PREFIX/bin/agentlocks"
          test -x "$BIN" || { echo "bin missing at $BIN"; ls -la "$PREFIX/bin" || true; exit 1; }
          node --version
          "$BIN" --version
          node scripts/conformance-scenario.mjs "$BIN" extended
          node scripts/ts-config-smoke.mjs "$BIN"

      # Windows: `npm i -g --prefix` writes a cmd-shim at <prefix>\agentlocks.cmd that runs
      # `node ...\dist\agentlocks.mjs %*`. This is the codex HIGH: npm cmd-shim + .mjs exec on
      # Windows. The conformance harness detects the non-.exe invocation and spawns it via a shell.
      - name: Install + conformance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = Join-Path $env:RUNNER_TEMP "al-prefix"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          $tgz = (Get-ChildItem -Filter "agentlocks-*.tgz" | Select-Object -First 1).FullName
          npm i -g --prefix $prefix $tgz
          if ($LASTEXITCODE -ne 0) { throw "npm install failed ($LASTEXITCODE)" }
          $bin = Join-Path $prefix "agentlocks.cmd"
          if (-not (Test-Path $bin)) { Get-ChildItem $prefix; throw "bin missing at $bin" }
          node --version
          & $bin --version
          if ($LASTEXITCODE -ne 0) { throw "agentlocks --version failed ($LASTEXITCODE)" }
          node scripts/conformance-scenario.mjs "$bin" extended
          if ($LASTEXITCODE -ne 0) { throw "conformance failed ($LASTEXITCODE)" }
          node scripts/ts-config-smoke.mjs "$bin"
          if ($LASTEXITCODE -ne 0) { throw "ts-config-smoke failed ($LASTEXITCODE)" }

  # Alpine/musl proof. JS actions cannot run inside an Alpine container (the runner's Node can't be
  # injected; on arm64 it is unsupported outright), so we run the proof via `docker run` on the
  # glibc host with the workspace mounted -- the same pattern release.yml uses for its musl legs.
  # The image's Node 22.22.3 satisfies engines.node >=22.18; git is added for the commit step.
  musl-conformance:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentlocks-tarball

      - name: Install + conformance (musl)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            node:22.22.3-alpine3.23@sha256:968df39aedcea65eeb078fb336ed7191baf48f972b4479711397108be0966920 \
            sh -euc '
              apk add --no-cache git >/dev/null
              prefix=/tmp/al-prefix
              mkdir -p "$prefix"
              npm i -g --prefix "$prefix" /work/agentlocks-*.tgz
              bin="$prefix/bin/agentlocks"
              node --version
              "$bin" --version
              node scripts/conformance-scenario.mjs "$bin" extended
              node scripts/ts-config-smoke.mjs "$bin"
            '
