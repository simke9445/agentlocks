name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast white-box gate: the full suite + types + lint on Linux. Runs in parallel with windows-unit
  # and the pack -> conformance chain; typecheck/lint are OS-independent so they are not repeated on
  # the (slower, costlier) Windows runner -- windows-unit re-runs only `bun test` there.
  check:
    name: test + typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

  # Build + pack the single Node bundle ONCE, exactly as release.yml's pack does (explicit
  # `bun run build` then `npm pack --ignore-scripts`, renamed to main.tgz). Uploads the same two
  # artifacts release.yml uploads -- `main-tarball` (the exact bytes a release would publish) and
  # `ci-scripts` (the conformance harness) -- so the conformance job below consumes an identical
  # contract to the release gate. The bundle is one ~157 KB dist/agentlocks.mjs run under the user's
  # Node, REPLACING the 60-112 MB embedded-Bun per-platform binaries (Option 1, bundle-size reduction).
  pack:
    name: pack the bundle tarball
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build explicitly, THEN pack with --ignore-scripts: the bundle is already in dist/, so the
      # tarball is the same bytes release.yml packs (prepack would rebuild identically but adds stdout).
      - name: Build the Node bundle
        run: bun run build
      - name: Pack the bundle tarball
        run: |
          set -eu
          npm pack --ignore-scripts
          mv agentlocks-*.tgz main.tgz

      - name: Upload the bundle tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-tarball
          path: main.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Upload the conformance scripts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # conformance.yml runs `node scripts/conformance-scenario.mjs` + `node scripts/ts-config-smoke.mjs`
          # with no checkout; scripts/ is the common root, so download to `scripts` restores the layout.
          name: ci-scripts
          path: |
            scripts/conformance-scenario.mjs
            scripts/ts-config-smoke.mjs
            scripts/ci/dist-integrity.sh
          if-no-files-found: error
          retention-days: 1

  # Black-box conformance fan-out: 3 OS x 3 Node + musl, all proving the SAME packed bytes the SAME
  # way release.yml proves them (one reusable workflow, called by both). assert_version is left empty
  # here -- CI proves the bundle installs and runs; release additionally asserts the tagged version.
  conformance:
    name: conformance
    needs: pack
    permissions: {}
    uses: ./.github/workflows/conformance.yml

  # White-box Windows port gate (full lock suite). Independent of pack, so it runs fully in parallel.
  windows-unit:
    # A reusable workflow's token is capped by the caller; grant the checkout's contents:read.
    permissions:
      contents: read
    uses: ./.github/workflows/windows-unit.yml
