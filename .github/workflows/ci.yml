name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: test + typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

  smoke:
    name: install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds this platform's compiled binary, stages the npm-install layout, and runs the
      # Node launcher with the Bun fallback disabled, proving `npm i -g agentlocks` works
      # with no Bun on the machine.
      - name: Install smoke test
        run: bun run smoke

  # Windows port gate (PRODUCTION_CI_DESIGN_V2.md section 4.7 / step 9). White-box: the full lock
  # suite must pass on Windows. Black-box: a freshly built win32 binary must pass the extended
  # conformance scenario (rename-replace, conflict, reclaim, git-index cycle, backslash path). Make
  # this a required check on PRs so the Windows port cannot regress between releases.
  windows-unit:
    name: windows-unit (bun test + conformance)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test (full lock suite on Windows)
        run: bun test

      - name: Build the win32 binary and run the extended conformance scenario
        shell: bash
        run: |
          bun scripts/build-binaries.mjs win32-x64
          node scripts/conformance-scenario.mjs "$(pwd)/npm/win32-x64/bin/agentlocks.exe" extended
