name: Release

# Bundle release pipeline (see BUNDLE_SIZE_REDUCTION.md + docs/production_ci_design.md). agentlocks
# ships ONE ~157 KB Node bundle (dist/agentlocks.mjs) run under the user's Node, NOT 7 embedded-Bun
# per-platform binaries. So the pipeline is: build + pack ONE tarball -> verify it installs and runs
# on every target OS/libc and on the minimum supported Node -> ONE OIDC publish that flips `latest`.
# The verify matrix is a real `needs:` barrier in front of the flip, so a release whose tarball fails
# to install-and-run on any target never becomes the `latest` that `npm i -g agentlocks` resolves.
#
# Windows: there is no .exe. `npm i -g` writes a cmd-shim (agentlocks.cmd) that runs
# `node ...\dist\agentlocks.mjs %*`; the win32 verify legs prove that shim end to end (extended
# conformance + the .ts-config contract) on BOTH the min-node floor and the release pin. windows-unit
# (the white-box gate) additionally runs the full lock suite + the same install proof on Windows.
#
# Only the flip job holds the publish credential (id-token); pack/verify never do. Every mutable input
# is digest-pinned and aged past the 7-day supply-chain window:
#   actions/checkout      v6.0.2  (2026-01-09)
#   oven-sh/setup-bun     v2.2.0  (2026-03-14)
#   actions/setup-node    v6.4.0  (2026-04-20)
#   actions/upload-artifact   v7.0.1  (2026-04-10)
#   actions/download-artifact v8.0.1  (2026-03-11)
#   npm 11.15.0 (>= the 11.5.1 OIDC floor); node 24.16.0; node:22.22.3-alpine3.23 (digest-pinned)

on:
  push:
    tags:
      - "v*"

# latest is a global resource: release one tag at a time and never cancel a half-done flip.
# cancel-in-progress:false leaves an in-flight release running and queues a newer tag behind it.
concurrency:
  group: release
  cancel-in-progress: false

# No workflow-wide privilege. Each job opts in to exactly what it needs.
permissions: {}

env:
  NPM_PIN: "11.15.0"
  NODE_PIN: "24.16.0"
  # engines.node floor: the first Node with unflagged .ts type-stripping (so the scaffolded
  # agentlocks.config.ts loads). The verify matrix proves the tarball on this floor, not just the pin.
  NODE_FLOOR: "22.18.0"
  MUSL_IMAGE: "node:22.22.3-alpine3.23@sha256:968df39aedcea65eeb078fb336ed7191baf48f972b4479711397108be0966920"

jobs:
  # White-box Windows gate: the full lock suite must pass on Windows, and the packed bundle must
  # install + pass the extended black-box conformance + the .ts-config contract via the npm cmd-shim,
  # before anything publishes. Shared with ci.yml via the reusable workflow.
  windows-unit:
    # A reusable workflow's token can only be downgraded by the caller; grant checkout's contents:read.
    permissions:
      contents: read
    uses: ./.github/workflows/windows-unit.yml

  # Build + pack the single bundle tarball ONCE; guard the tag; record integrity; run the
  # monotonic-version guard. No id-token here -- this job never publishes (the flip is the only
  # publish), so the packed bytes are produced without the publish credential in scope.
  pack:
    needs: windows-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.guards.outputs.version }}
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # the ancestry guard needs history
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Verify (test + typecheck + lint)
        run: bun run check
      - name: Pin npm (>= the 11.5.1 OIDC floor)
        run: npm install -g "npm@${NPM_PIN}" --ignore-scripts

      - name: Early guards (tag shape, tag == package.json, ancestry)
        id: guards
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          # Tag shape: a plain X.Y.Z release only (the v* trigger also matches v1.2.3-rc.1).
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version not X.Y.Z: $VERSION"; exit 1; }
          # Tag must match the manifest.
          PKG="$(node -p "require('./package.json').version")"
          [ "$VERSION" = "$PKG" ] || { echo "::error::tag $VERSION != package.json $PKG"; exit 1; }
          # Tagged commit must be on the protected branch (a v* tag can point anywhere).
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tagged commit is not on origin/main"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Build explicitly, THEN pack with --ignore-scripts: the bundle is already in dist/, so
      # `npm pack --json` emits only the JSON (no prepack stdout to corrupt the integrity parse).
      - name: Build the Node bundle
        run: bun run build
      - name: Pack the bundle tarball (NOT published here); record its integrity
        id: pack
        run: |
          set -eu
          INTEGRITY="$(npm pack --json --ignore-scripts 2>/dev/null | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const j=JSON.parse(s);process.stdout.write(j[0].integrity);})')"
          mv agentlocks-*.tgz main.tgz
          echo "integrity=$INTEGRITY" >> "$GITHUB_OUTPUT"

      - name: Monotonic version guard (equal-version allowed only as an idempotent recovery)
        env:
          VERSION: ${{ steps.guards.outputs.version }}
          OUR: ${{ steps.pack.outputs.integrity }}
        run: |
          set -eu
          # Fetch published versions with a retry; a brand-new package (E404) is the first release. A
          # genuine network failure FAILS the guard (it never passes vacuously).
          VERSIONS_JSON=""
          i=1
          while [ "$i" -le 4 ]; do
            if VERSIONS_JSON="$(npm view agentlocks versions --json 2>/tmp/npmerr)"; then break; fi
            if grep -q "E404" /tmp/npmerr; then VERSIONS_JSON="[]"; break; fi
            if [ "$i" -eq 4 ]; then echo "::error::npm view agentlocks failed (network?)"; cat /tmp/npmerr; exit 1; fi
            i=$((i + 1)); sleep 5
          done
          # Below max: fail. Equal max: pass ONLY when the published bytes match this run (idempotent
          # recovery, which the flip then no-ops); else foreign/stale -> fail. Greater / first: pass.
          PUB_MAIN="$(sh scripts/ci/dist-integrity.sh "agentlocks@$VERSION")"
          VERSIONS_JSON="$VERSIONS_JSON" PUB_MAIN="$PUB_MAIN" node scripts/ci/check-monotonic.mjs

      - name: Upload the bundle tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-tarball
          path: main.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Upload the verify/flip scripts (verify + flip run them without a checkout)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-scripts
          # verify runs conformance-scenario.mjs + ts-config-smoke.mjs; flip runs dist-integrity.sh.
          # scripts/ is the common root, so download to `scripts` restores the layout these commands
          # expect (`node scripts/...`, `sh scripts/ci/...`).
          path: |
            scripts/conformance-scenario.mjs
            scripts/ts-config-smoke.mjs
            scripts/ci/dist-integrity.sh
          if-no-files-found: error
          retention-days: 7

  # THE GATE. Install the packed tarball globally (no Bun present) and run the extended conformance
  # scenario + the .ts-config contract against the INSTALLED bin shim, on every target OS x {min-node
  # floor, release pin}. No id-token, no checkout: a job that proves the published bytes holds neither
  # the publish credential nor a repo token (download-artifact uses the runtime token). fail-fast off.
  #
  # Arch note: the bundle is pure JS, byte-identical on every CPU arch, so the meaningful axes are OS
  # (path / spawn / npm-shim behavior), libc (the musl leg below), and Node version -- NOT CPU arch.
  # macos-latest is arm64 and ubuntu/windows are x64, so both arches do execute the bundle here; a
  # separate linux-arm64 leg would re-run the identical JS and is intentionally omitted.
  verify:
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.18.0", "24.16.0"]
    steps:
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: main-tarball
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-scripts
          path: scripts # conformance-scenario.mjs + ts-config-smoke.mjs land back under scripts/

      # POSIX: `npm i -g --prefix` puts the bin at <prefix>/bin/agentlocks, a symlink whose
      # `#!/usr/bin/env node` shebang runs the bundle. No Bun on PATH -> proves the pure-Node path.
      - name: Install + prove the bundle (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/al-prefix"
          mkdir -p "$PREFIX"
          npm i -g --prefix "$PREFIX" "$PWD/main.tgz"
          BIN="$PREFIX/bin/agentlocks"
          test -x "$BIN" || { echo "bin missing at $BIN"; ls -la "$PREFIX/bin" || true; exit 1; }
          node --version
          GOT="$("$BIN" --version)"
          [ "$GOT" = "$VERSION" ] || { echo "::error::--version $GOT != $VERSION"; exit 1; }
          node scripts/conformance-scenario.mjs "$BIN" extended
          node scripts/ts-config-smoke.mjs "$BIN"

      # Windows: `npm i -g --prefix` writes a cmd-shim at <prefix>\agentlocks.cmd that runs
      # `node ...\dist\agentlocks.mjs %*`. The conformance harness detects the non-.exe invocation and
      # spawns it via a shell. This is the win32 release gate: the bundle served the npm way on Windows.
      - name: Install + prove the bundle (Windows cmd-shim + .mjs exec)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = Join-Path $env:RUNNER_TEMP "al-prefix"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          $tgz = (Resolve-Path main.tgz).Path
          npm i -g --prefix $prefix $tgz
          if ($LASTEXITCODE -ne 0) { throw "npm install failed ($LASTEXITCODE)" }
          $bin = Join-Path $prefix "agentlocks.cmd"
          if (-not (Test-Path $bin)) { Get-ChildItem $prefix; throw "bin missing at $bin" }
          node --version
          $got = (& $bin --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "agentlocks --version failed ($LASTEXITCODE)" }
          if ($got -ne $env:VERSION) { throw "--version '$got' != '$($env:VERSION)'" }
          node scripts/conformance-scenario.mjs "$bin" extended
          if ($LASTEXITCODE -ne 0) { throw "conformance failed ($LASTEXITCODE)" }
          node scripts/ts-config-smoke.mjs "$bin"
          if ($LASTEXITCODE -ne 0) { throw "ts-config-smoke failed ($LASTEXITCODE)" }

  # Alpine/musl leg. JS actions cannot run in an Alpine container on arm64, so the proof runs via
  # docker on the glibc host with the workspace mounted (same pattern as bundle-conformance.yml). The
  # image's Node 22.22.3 satisfies engines.node >=22.18; git is added for the conformance commit step.
  musl-verify:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: main-tarball
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-scripts
          path: scripts
      - name: Install + prove the bundle (musl)
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e VERSION \
            "$MUSL_IMAGE" \
            sh -euc '
              apk add --no-cache git >/dev/null
              prefix=/tmp/al-prefix
              mkdir -p "$prefix"
              npm i -g --prefix "$prefix" /work/main.tgz
              bin="$prefix/bin/agentlocks"
              node --version
              got="$("$bin" --version)"
              [ "$got" = "$VERSION" ] || { echo "::error::--version $got != $VERSION"; exit 1; }
              node scripts/conformance-scenario.mjs "$bin" extended
              node scripts/ts-config-smoke.mjs "$bin"
            '

  # The only irreversible, user-visible step, behind the one human approval (environment: release). The
  # approver sees the full green verify matrix first. Publishes the SAME main.tgz the matrix installed.
  flip:
    needs: [verify, musl-verify, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_PIN }}
          # registry-url + id-token: write + NO NODE_AUTH_TOKEN => npm >= 11.5.1 publishes via OIDC
          # trusted publishing (a matching trusted publisher must exist on the agentlocks package).
          # Removing registry-url does NOT enable OIDC -- npm then has no registry auth (ENEEDAUTH).
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: npm install -g "npm@${NPM_PIN}" --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: main-tarball
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-scripts
          path: scripts # dist-integrity.sh (run via `sh`, since artifacts strip the +x bit)
      - name: Flip latest (publish main.tgz), idempotent on a pre-existing main@X via integrity
        env:
          VERSION: ${{ needs.pack.outputs.version }}
          OUR_INTEGRITY: ${{ needs.pack.outputs.integrity }}
        run: |
          set -eu
          PUB="$(sh scripts/ci/dist-integrity.sh "agentlocks@$VERSION")"
          if [ -n "$PUB" ]; then
            # main@X already exists. If its bytes are the ones this run packed, the run already flipped
            # (recovery re-run) -> no-op. Otherwise foreign/stale bytes are live -> hard fail.
            if [ "$PUB" = "$OUR_INTEGRITY" ]; then
              echo "agentlocks@$VERSION already published with this run's bytes; flip is a no-op"
            else
              echo "::error::agentlocks@$VERSION exists with different bytes (ours=$OUR_INTEGRITY pub=$PUB); not overwriting"
              exit 1
            fi
          else
            npm publish ./main.tgz --provenance --access public --ignore-scripts
            # Post-publish: confirm the registry serves our exact bytes (propagation retry).
            GOT=""
            g=1
            while [ "$g" -le 6 ]; do
              GOT="$(npm view "agentlocks@$VERSION" dist.integrity --prefer-online 2>/dev/null || true)"
              [ -n "$GOT" ] && break
              echo "waiting for agentlocks@$VERSION to propagate ($g)"; g=$((g + 1)); sleep 10
            done
            [ "$GOT" = "$OUR_INTEGRITY" ] || { echo "::error::published agentlocks@$VERSION bytes != ours (got=$GOT ours=$OUR_INTEGRITY)"; exit 1; }
          fi
      - name: Terminal confirmation (post-flip; warns on propagation lag, hard-fails on wrong version)
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -eu
          PREFIX="$(pwd)/.confirm-prefix"; mkdir -p "$PREFIX"; export npm_config_prefix="$PREFIX"
          i=1
          while [ "$i" -le 6 ]; do
            # Unpinned install: proves `latest` itself now resolves $VERSION (an exact-version install
            # would pass even if latest still pointed at the old release). --prefer-online so a cached
            # old packument cannot mask the just-flipped latest.
            if npm install -g agentlocks --prefer-online --ignore-scripts; then
              GOT="$("$PREFIX/bin/agentlocks" --version || true)"
              case "$GOT" in
                *"$VERSION"*) echo "latest resolves $VERSION"; exit 0 ;;
                *) echo "latest still resolves '$GOT' (propagation lag)" ;;
              esac
            fi
            echo "post-flip propagation retry $i"; i=$((i + 1)); sleep 10
          done
          echo "::warning::agentlocks@$VERSION not yet resolvable post-flip (propagation lag); not rolling back"

  # Separate from flip so a re-run reaches it even when the flip step no-ops on an already-published
  # main@X. Idempotent. Attaches the single bundle tarball as the release asset.
  release-notes:
    needs: flip
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: main-tarball
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          awk -v v="## $V" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Release $GITHUB_REF_NAME." > dist/notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/notes.md
            gh release upload "$GITHUB_REF_NAME" main.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file dist/notes.md main.tgz
          fi
