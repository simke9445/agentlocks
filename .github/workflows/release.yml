name: Release

# Bundle release pipeline (see BUNDLE_SIZE_REDUCTION.md + docs/production_ci_design.md). agentlocks
# ships ONE ~157 KB Node bundle (dist/agentlocks.mjs) run under the user's Node, NOT 7 embedded-Bun
# per-platform binaries. So the pipeline is: build + pack ONE tarball -> prove it installs and runs
# on every target OS/libc/Node -> ONE OIDC publish that flips `latest`. pack and the white-box
# windows-unit gate run in PARALLEL; the conformance matrix and windows-unit are both real `needs:`
# barriers in front of the flip, so a release whose tarball fails to install-and-run (or reports the
# wrong version) on any target never becomes the `latest` that `npm i -g agentlocks` resolves.
#
# Conformance is the SAME reusable workflow ci.yml runs on every push (.github/workflows/conformance.yml),
# called here with assert_version set: if it is green in CI, the release re-runs an identical proof and
# additionally asserts the tagged version. Windows: there is no .exe. `npm i -g` writes a cmd-shim
# (agentlocks.cmd) that runs `node ...\dist\agentlocks.mjs %*`; the win32 conformance legs prove that
# shim end to end (extended conformance + the .ts-config contract) across the node fan-out. windows-unit
# (the white-box gate) runs the full lock suite on Windows.
#
# Only the flip job holds the publish credential (id-token); pack/conformance never do. Every mutable input
# is digest-pinned and aged past the 7-day supply-chain window:
#   actions/checkout      v6.0.2  (2026-01-09)
#   oven-sh/setup-bun     v2.2.0  (2026-03-14)
#   actions/setup-node    v6.4.0  (2026-04-20)
#   actions/upload-artifact   v7.0.1  (2026-04-10)
#   actions/download-artifact v8.0.1  (2026-03-11)
#   npm 11.15.0 (>= the 11.5.1 OIDC floor); node 24.16.0
# (the conformance matrix's Node floor + the digest-pinned musl image live in conformance.yml).

on:
  push:
    tags:
      - "v*"

# latest is a global resource: release one tag at a time and never cancel a half-done flip.
# cancel-in-progress:false leaves an in-flight release running and queues a newer tag behind it.
concurrency:
  group: release
  cancel-in-progress: false

# No workflow-wide privilege. Each job opts in to exactly what it needs.
permissions: {}

env:
  NPM_PIN: "11.15.0"
  NODE_PIN: "24.16.0"

jobs:
  # White-box Windows gate: the full lock suite must pass on Windows before anything publishes (a
  # flip barrier). The black-box Windows install proof (npm cmd-shim + extended conformance) is the
  # conformance job's windows-latest legs. Shared with ci.yml via the reusable workflow.
  windows-unit:
    # A reusable workflow's token can only be downgraded by the caller; grant checkout's contents:read.
    permissions:
      contents: read
    uses: ./.github/workflows/windows-unit.yml

  # Build + pack the single bundle tarball ONCE; guard the tag; record integrity; run the
  # monotonic-version guard. No id-token here -- this job never publishes (the flip is the only
  # publish), so the packed bytes are produced without the publish credential in scope. Runs in
  # PARALLEL with windows-unit (both are flip barriers); neither blocks the other.
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.guards.outputs.version }}
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # the ancestry guard needs history
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      # Pin Node for the npm/pack/node work that produces the PUBLISHED bytes (mirrors ci.yml's pack
      # job; `flip` pins the same NODE_PIN). Without this, npm pack + the guard's `node` run on the
      # runner's drifting default Node instead of a fixed toolchain.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_PIN }}
      - run: bun install --frozen-lockfile
      - name: Verify (test + typecheck + lint)
        run: bun run check
      - name: Pin npm (>= the 11.5.1 OIDC floor)
        run: npm install -g "npm@${NPM_PIN}" --ignore-scripts

      - name: Early guards (tag shape, tag == package.json, ancestry)
        id: guards
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          # Tag shape: a plain X.Y.Z release only (the v* trigger also matches v1.2.3-rc.1).
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version not X.Y.Z: $VERSION"; exit 1; }
          # Tag must match the manifest.
          PKG="$(node -p "require('./package.json').version")"
          [ "$VERSION" = "$PKG" ] || { echo "::error::tag $VERSION != package.json $PKG"; exit 1; }
          # Tagged commit must be on the protected branch (a v* tag can point anywhere).
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tagged commit is not on origin/main"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Build explicitly, THEN pack with --ignore-scripts: the bundle is already in dist/, so
      # `npm pack --json` emits only the JSON (no prepack stdout to corrupt the integrity parse).
      - name: Build the Node bundle
        run: bun run build
      - name: Pack the bundle tarball (NOT published here); record its integrity
        id: pack
        run: |
          set -eu
          INTEGRITY="$(npm pack --json --ignore-scripts 2>/dev/null | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const j=JSON.parse(s);process.stdout.write(j[0].integrity);})')"
          mv agentlocks-*.tgz main.tgz
          echo "integrity=$INTEGRITY" >> "$GITHUB_OUTPUT"

      - name: Monotonic version guard (equal-version allowed only as an idempotent recovery)
        env:
          VERSION: ${{ steps.guards.outputs.version }}
          OUR: ${{ steps.pack.outputs.integrity }}
        run: |
          set -eu
          # Fetch published versions with a retry; a brand-new package (E404) is the first release. A
          # genuine network failure FAILS the guard (it never passes vacuously).
          VERSIONS_JSON=""
          i=1
          while [ "$i" -le 4 ]; do
            if VERSIONS_JSON="$(npm view agentlocks versions --json 2>/tmp/npmerr)"; then break; fi
            if grep -q "E404" /tmp/npmerr; then VERSIONS_JSON="[]"; break; fi
            if [ "$i" -eq 4 ]; then echo "::error::npm view agentlocks failed (network?)"; cat /tmp/npmerr; exit 1; fi
            i=$((i + 1)); sleep 5
          done
          # Below max: fail. Equal max: pass ONLY when the published bytes match this run (idempotent
          # recovery, which the flip then no-ops); else foreign/stale -> fail. Greater / first: pass.
          PUB_MAIN="$(sh scripts/ci/dist-integrity.sh "agentlocks@$VERSION")"
          VERSIONS_JSON="$VERSIONS_JSON" PUB_MAIN="$PUB_MAIN" node scripts/ci/check-monotonic.mjs

      - name: Upload the bundle tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-tarball
          path: main.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Upload the conformance/flip scripts (consumed without a checkout)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-scripts
          # conformance runs conformance-scenario.mjs + ts-config-smoke.mjs; flip runs dist-integrity.sh.
          # scripts/ is the common root, so download to `scripts` restores the layout these commands
          # expect (`node scripts/...`, `sh scripts/ci/...`).
          path: |
            scripts/conformance-scenario.mjs
            scripts/ts-config-smoke.mjs
            scripts/ci/dist-integrity.sh
          if-no-files-found: error
          retention-days: 7

  # THE GATE. Install the packed tarball globally (no Bun) and prove it RUNS -- extended conformance
  # + the .ts-config contract against the INSTALLED bin shim -- on every target OS x libc x Node,
  # asserting the tagged version. This is the SAME reusable ci.yml runs on every push, called here
  # with assert_version set: a real `needs:` barrier in front of the flip, so a release whose tarball
  # fails to install-and-run (or reports the wrong version) on any target never becomes the `latest`
  # that `npm i -g agentlocks` resolves. No id-token, no checkout (see conformance.yml).
  conformance:
    needs: pack
    permissions: {}
    uses: ./.github/workflows/conformance.yml
    with:
      assert_version: ${{ needs.pack.outputs.version }}

  # The only irreversible, user-visible step, behind the one human approval (environment: release).
  # The approver sees the full green conformance matrix + windows-unit first. Publishes the SAME
  # main.tgz the matrix installed.
  flip:
    needs: [conformance, windows-unit, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_PIN }}
          # registry-url + id-token: write + NO NODE_AUTH_TOKEN => npm >= 11.5.1 publishes via OIDC
          # trusted publishing (a matching trusted publisher must exist on the agentlocks package).
          # Removing registry-url does NOT enable OIDC -- npm then has no registry auth (ENEEDAUTH).
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: npm install -g "npm@${NPM_PIN}" --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: main-tarball
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-scripts
          path: scripts # dist-integrity.sh (run via `sh`, since artifacts strip the +x bit)
      - name: Flip latest (publish main.tgz), idempotent on a pre-existing main@X via integrity
        env:
          VERSION: ${{ needs.pack.outputs.version }}
          OUR_INTEGRITY: ${{ needs.pack.outputs.integrity }}
        run: |
          set -eu
          PUB="$(sh scripts/ci/dist-integrity.sh "agentlocks@$VERSION")"
          if [ -n "$PUB" ]; then
            # main@X already exists. If its bytes are the ones this run packed, the run already flipped
            # (recovery re-run) -> no-op. Otherwise foreign/stale bytes are live -> hard fail.
            if [ "$PUB" = "$OUR_INTEGRITY" ]; then
              echo "agentlocks@$VERSION already published with this run's bytes; flip is a no-op"
            else
              echo "::error::agentlocks@$VERSION exists with different bytes (ours=$OUR_INTEGRITY pub=$PUB); not overwriting"
              exit 1
            fi
          else
            npm publish ./main.tgz --provenance --access public --ignore-scripts
            # Post-publish: confirm the registry serves our exact bytes (propagation retry).
            GOT=""
            g=1
            while [ "$g" -le 6 ]; do
              GOT="$(npm view "agentlocks@$VERSION" dist.integrity --prefer-online 2>/dev/null || true)"
              [ -n "$GOT" ] && break
              echo "waiting for agentlocks@$VERSION to propagate ($g)"; g=$((g + 1)); sleep 10
            done
            [ "$GOT" = "$OUR_INTEGRITY" ] || { echo "::error::published agentlocks@$VERSION bytes != ours (got=$GOT ours=$OUR_INTEGRITY)"; exit 1; }
          fi
      - name: Terminal confirmation (unpinned install must resolve the new version; hard-fails otherwise)
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -eu
          PREFIX="$(pwd)/.confirm-prefix"; mkdir -p "$PREFIX"; export npm_config_prefix="$PREFIX"
          GOT=""
          i=1
          while [ "$i" -le 8 ]; do
            # Unpinned install: proves `latest` itself now resolves $VERSION (an exact-version install
            # would pass even if latest still pointed at the old release). --prefer-online so a cached
            # old packument cannot mask the just-flipped latest.
            if npm install -g agentlocks --prefer-online --ignore-scripts; then
              GOT="$("$PREFIX/bin/agentlocks" --version || true)"
              case "$GOT" in
                *"$VERSION"*) echo "latest resolves $VERSION"; exit 0 ;;
                *) echo "latest still resolves '$GOT' (propagation lag $i)" ;;
              esac
            else
              echo "unpinned install failed (attempt $i)"
            fi
            i=$((i + 1)); sleep 15
          done
          # The flip already confirmed the registry serves our exact bytes (dist.integrity match), so a
          # persistent failure HERE means `latest` is not resolving the just-published version -- a real
          # problem, not benign lag. Fail terminally (the irreversible publish is NOT rolled back; a red
          # run is the correct signal for the maintainer to investigate the dist-tag).
          echo "::error::agentlocks@$VERSION not resolvable via an unpinned 'npm i -g agentlocks' after retries (last saw '${GOT:-<install-failed>}')"
          exit 1

  # Separate from flip so a re-run reaches it even when the flip step no-ops on an already-published
  # main@X. Idempotent. Attaches the single bundle tarball as the release asset.
  release-notes:
    needs: flip
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: main-tarball
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          awk -v v="## $V" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Release $GITHUB_REF_NAME." > dist/notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/notes.md
            gh release upload "$GITHUB_REF_NAME" main.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file dist/notes.md main.tgz
          fi
