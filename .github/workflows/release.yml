name: Release

# V2 pipeline (see PRODUCTION_CI_DESIGN_V2.md): build -> publish-stage -> verify (matrix over
# every target) -> flip -> release-notes. The verify matrix is a real `needs:` barrier in front of
# the flip, so no release in which any platform binary fails to install-and-run on its real OS ever
# becomes the `latest` that `npm i -g agentlocks` resolves. Stays tokenless: the flip is a plain
# `npm publish` of the packed main tarball that OIDC trusted publishing already authorizes.
#
# Every mutable input is pinned (Section 6 step 8). Aged past the 7-day supply-chain window:
#   actions/checkout      v6.0.2  (2026-01-09)
#   oven-sh/setup-bun     v2.2.0  (2026-03-14)
#   actions/setup-node    v6.4.0  (2026-04-20)
#   actions/upload-artifact   v7.0.1  (2026-04-10)
#   actions/download-artifact v8.0.1  (2026-03-11)
#   npm 11.15.0 (2026-05-20, >= the 11.5.1 OIDC floor); node 24.16.0 (2026-05-21)
#   node:22.22.3-alpine3.23 (2026-05-14), digest-pinned in the verify matrix

on:
  push:
    tags:
      - "v*"

# latest is a global resource: one release at a time, FIFO, never drop a queued tag, never cancel
# a half-done flip. queue:max requires cancel-in-progress:false.
concurrency:
  group: release
  queue: max
  cancel-in-progress: false

# No workflow-wide privilege. Each job opts in to exactly what it needs.
permissions: {}

env:
  NPM_PIN: "11.15.0"
  NODE_PIN: "24.16.0"
  # Single source of truth for the platform target dirs (the shell loops below read $TARGETS). The
  # verify matrix is necessarily explicit (per-target runner/shell/mode) and must mirror this list.
  TARGETS: "darwin-arm64 darwin-x64 linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl win32-x64"

jobs:
  # White-box Windows gate: the lock test suite must pass on Windows before anything publishes, and
  # a freshly built win32 binary must pass the extended black-box scenario. Gates publish-stage.
  windows-unit:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: bun test (full lock suite on Windows)
        run: bun test
      - name: Build the win32 binary and run the extended conformance scenario against it
        shell: bash
        run: |
          bun scripts/build-binaries.mjs win32-x64
          node scripts/conformance-scenario.mjs "$(pwd)/npm/win32-x64/bin/agentlocks.exe" extended

  # Cross-compile every target binary into npm/<dir>/bin and hand them on as artifacts, plus the
  # conformance script the verify matrix runs (so verify needs no checkout / repo token). No secrets.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Verify (test + typecheck + lint)
        run: bun run check
      - name: Cross-compile all platform binaries
        run: bun run build:binaries
      - name: Upload platform binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-binaries
          path: npm/*/bin/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload the conformance script (verify runs it without a checkout)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-script
          path: scripts/conformance-scenario.mjs
          if-no-files-found: error
          retention-days: 7

  # OIDC job. Order matters: guard the tag, inject + pack main and record its integrity, run the
  # monotonic-version guard (which uses that integrity to allow only an idempotent equal-version
  # recovery), THEN publish the platform packages under a preflight tag (so an unverified @X is never
  # what `npm i agentlocks-<plat>` resolves; main pins them by exact version). Each platform publish
  # guards the manifest (name/os/cpu/libc) and the bytes (integrity match, so skip-if-exists cannot
  # accept foreign/stale bytes). Nothing that `npm i -g agentlocks` resolves exists after this job:
  # main is packed, not published.
  publish-stage:
    needs: [build, windows-unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.guards.outputs.version }}
      main_integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # need history so the merge-base ancestry guard is meaningful
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_PIN }}
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node bundles an older npm. Pinned, not @latest.
      # No `bun install` here: this OIDC (id-token) job runs only npm/node/git inline scripts, so
      # project dependency lifecycle scripts never execute in the publish-credential context.
      - name: Pin npm
        run: npm install -g "npm@${NPM_PIN}"

      - name: Early guards (tag shape, tag == package.json, ancestry)
        id: guards
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          # Tag shape: a plain X.Y.Z release only (the v* trigger also matches v1.2.3-rc.1).
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version not X.Y.Z: $VERSION"; exit 1; }
          # Tag must match the manifest.
          PKG="$(node -p "require('./package.json').version")"
          [ "$VERSION" = "$PKG" ] || { echo "::error::tag $VERSION != package.json $PKG"; exit 1; }
          # Tagged commit must be on the protected branch (a v* tag can point anywhere).
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tagged commit is not on origin/main"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Inject optionalDependencies into main and assert the exact set
        env:
          VERSION: ${{ steps.guards.outputs.version }}
        run: |
          set -eu
          for d in $TARGETS; do npm pkg set "optionalDependencies.agentlocks-$d=$VERSION"; done
          node -e '
            const want = process.env.TARGETS.trim().split(/\s+/).map((s) => "agentlocks-" + s);
            const od = require("./package.json").optionalDependencies || {};
            const got = Object.keys(od).sort();
            const exp = [...want].sort();
            if (got.length !== exp.length || got.some((k, i) => k !== exp[i])) { console.error("::error::optionalDependencies set mismatch: " + got.join(",")); process.exit(1); }
            for (const k of want) if (od[k] !== process.env.VERSION) { console.error("::error::" + k + " pinned at " + od[k] + " not " + process.env.VERSION); process.exit(1); }
          '

      - name: Pack main into a tarball (NOT published here); record its integrity
        id: pack
        run: |
          set -eu
          INTEGRITY="$(npm pack --json --ignore-scripts 2>/dev/null | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const j=JSON.parse(s);process.stdout.write(j[0].integrity);})')"
          mv agentlocks-*.tgz main.tgz
          echo "integrity=$INTEGRITY" >> "$GITHUB_OUTPUT"

      - name: Monotonic version guard (equal-version allowed only as an idempotent recovery)
        env:
          VERSION: ${{ steps.guards.outputs.version }}
          OUR: ${{ steps.pack.outputs.integrity }}
        run: |
          set -eu
          # Fetch published versions with a retry (network); a brand-new package (E404) is the first
          # release. A genuine network failure FAILS the guard (it never passes vacuously).
          VERSIONS_JSON=""
          i=1
          while [ "$i" -le 4 ]; do
            if VERSIONS_JSON="$(npm view agentlocks versions --json 2>/tmp/npmerr)"; then break; fi
            if grep -q "E404" /tmp/npmerr; then VERSIONS_JSON="[]"; break; fi
            if [ "$i" -eq 4 ]; then echo "::error::npm view agentlocks failed (network?)"; cat /tmp/npmerr; exit 1; fi
            i=$((i + 1)); sleep 5
          done
          PUB_MAIN="$(npm view "agentlocks@$VERSION" dist.integrity 2>/dev/null || true)"
          # Below max: fail. Equal max: pass ONLY when the published main bytes match this run (an
          # idempotent recovery, which the flip then no-ops); otherwise foreign/stale -> fail.
          # Strictly greater / first release: pass. Compared as numeric tuples (not string/semver).
          VERSIONS_JSON="$VERSIONS_JSON" PUB_MAIN="$PUB_MAIN" node -e '
            const v = process.env.VERSION.split(".").map(Number);
            let versions = JSON.parse(process.env.VERSIONS_JSON || "[]");
            if (!Array.isArray(versions)) versions = [versions].filter(Boolean);
            const t = versions.map((s) => String(s).split(".").map(Number)).filter((x) => x.length === 3 && x.every(Number.isFinite));
            const cmp = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            const max = t.sort(cmp).pop();
            if (!max) process.exit(0);
            const c = cmp(v, max);
            if (c < 0) { console.error("::error::version " + process.env.VERSION + " is below the published max " + max.join(".")); process.exit(1); }
            if (c === 0) {
              if (process.env.PUB_MAIN && process.env.PUB_MAIN === process.env.OUR) { console.log("equal-max recovery re-run (main integrity matches)"); process.exit(0); }
              console.error("::error::version " + process.env.VERSION + " already the published max with different bytes (not a recovery)"); process.exit(1);
            }
          '

      - name: Download platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-binaries
          path: npm
      - name: Restore the executable bit (upload-artifact zips strip POSIX mode to 0644)
        run: chmod +x npm/*/bin/agentlocks # the 6 unix binaries; win32 is agentlocks.exe (no +x needed)

      - name: Publish platform packages (preflight tag), guarding manifest + bytes
        env:
          VERSION: ${{ steps.guards.outputs.version }}
        run: |
          set -eu
          for d in $TARGETS; do
            pkg="agentlocks-$d"
            ( cd "npm/$d" && npm pkg set "version=$VERSION" >/dev/null )
            # Pre-publish local guard: validate the manifest WE will publish (name/os/cpu/libc) and
            # that the binary is present, so a bad target fails BEFORE burning the immutable version.
            # (The post-publish npm-view check below then confirms the registry copy.)
            D="$d" node -e '
              const fs = require("fs"), path = require("path");
              const d = process.env.D;
              const m = require(path.resolve("npm", d, "package.json"));
              let dir = d, libc = null;
              if (dir.endsWith("-musl")) { libc = "musl"; dir = dir.slice(0, -5); }
              const i = dir.indexOf("-"), os = dir.slice(0, i), cpu = dir.slice(i + 1);
              if (os === "linux" && !libc) libc = "glibc";
              const eq = (a, b) => Array.isArray(a) && a.length === 1 && a[0] === b;
              const fail = (x) => { console.error("::error::pre-publish " + d + ": " + x); process.exit(1); };
              if (m.name !== "agentlocks-" + d) fail("name " + m.name);
              if (!eq(m.os, os)) fail("os " + JSON.stringify(m.os));
              if (!eq(m.cpu, cpu)) fail("cpu " + JSON.stringify(m.cpu));
              if (libc ? !eq(m.libc, libc) : m.libc) fail("libc " + JSON.stringify(m.libc));
              const exe = os === "win32" ? "agentlocks.exe" : "agentlocks";
              if (!fs.existsSync(path.resolve("npm", d, "bin", exe))) fail("missing bin/" + exe);
            '
            # Our exact publishable bytes for this package (deterministic integrity).
            OUR="$(cd "npm/$d" && npm pack --json --ignore-scripts 2>/dev/null | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const j=JSON.parse(s);process.stdout.write(j[0].integrity)})')"
            PUB="$(npm view "$pkg@$VERSION" dist.integrity 2>/dev/null || true)"
            if [ -n "$PUB" ]; then
              # Already on npm: accept ONLY if the bytes are ours (idempotent re-run); a mismatch is
              # foreign or stale and must hard-fail (skip-if-exists must never accept foreign bytes).
              [ "$OUR" = "$PUB" ] || { echo "::error::$pkg@$VERSION exists with different bytes (foreign/stale): ours=$OUR pub=$PUB"; exit 1; }
              echo "$pkg@$VERSION already published with matching bytes; skipping"
            else
              ( cd "npm/$d" && npm publish --provenance --access public --tag preflight --ignore-scripts )
            fi
            # Post-publish: confirm the registry copy's bytes equal ours (covers a fresh publish, not
            # only the pre-existing skip path above), retrying across CDN propagation.
            GOT=""
            j=1
            while [ "$j" -le 6 ]; do
              GOT="$(npm view "$pkg@$VERSION" dist.integrity 2>/dev/null || true)"
              [ -n "$GOT" ] && break
              echo "waiting for $pkg@$VERSION to propagate ($j)"; j=$((j + 1)); sleep 10
            done
            [ "$GOT" = "$OUR" ] || { echo "::error::$pkg@$VERSION published bytes != ours (got=$GOT ours=$OUR)"; exit 1; }
            # Manifest guard: name/version/os/cpu/libc must match what the dir declares, so a target
            # cannot ship under the wrong platform filter. (os/cpu/libc derived from the dir name.)
            npm view "$pkg@$VERSION" --json | D="$d" VERSION="$VERSION" node -e '
              let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{
                const m = JSON.parse(s);
                let dir = process.env.D, libc = null;
                if (dir.endsWith("-musl")) { libc = "musl"; dir = dir.slice(0, -5); }
                const i = dir.indexOf("-"), os = dir.slice(0, i), cpu = dir.slice(i + 1);
                if (os === "linux" && !libc) libc = "glibc"; // glibc packages declare libc:["glibc"]
                const eq = (a, b) => Array.isArray(a) && a.length === 1 && a[0] === b;
                const fail = (msg) => { console.error("::error::" + msg); process.exit(1); };
                if (m.name !== "agentlocks-" + process.env.D) fail("name " + m.name);
                if (m.version !== process.env.VERSION) fail("version " + m.version);
                if (!eq(m.os, os)) fail("os " + JSON.stringify(m.os));
                if (!eq(m.cpu, cpu)) fail("cpu " + JSON.stringify(m.cpu));
                if (libc ? !eq(m.libc, libc) : m.libc) fail("libc " + JSON.stringify(m.libc));
              });
            '
          done
          # The enforced foreign-byte gate is the integrity match above (in-workflow, tokenless): a
          # pre-existing package is accepted only when its published bytes equal ours, else hard-fail.
          # Every publish also passes --provenance, so consumers can verify origin via the npm
          # attestation. Optional future hardening: a gh-attestation-verify repo match, which needs
          # the packages to already exist, so it layers on at or after bootstrap (see RELEASING.md).

      - name: Upload the packed main tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-tarball
          path: main.tgz
          if-no-files-found: error
          retention-days: 7

  # THE GATE. One leg per target on its native runner. No id-token and no checkout here: a job that
  # runs freshly published binaries must hold neither the publish credential nor a repo token. It
  # gets main.tgz and the conformance script as artifacts (download-artifact uses the runtime token,
  # so permissions:{} is fine). fail-fast:false so every target reports.
  verify:
    needs: publish-stage
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 25
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        # One leg per dir in $TARGETS (the env list above); explicit here because each leg carries
        # its own runner/shell/container/mode. Keep this in sync with $TARGETS on a platform change.
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            shell: bash
            mode: basic
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            shell: bash
            mode: basic
          - target: linux-x64-musl
            runner: ubuntu-24.04
            container: node:22.22.3-alpine3.23@sha256:968df39aedcea65eeb078fb336ed7191baf48f972b4479711397108be0966920
            shell: sh
            mode: basic
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            container: node:22.22.3-alpine3.23@sha256:968df39aedcea65eeb078fb336ed7191baf48f972b4479711397108be0966920
            shell: sh
            mode: basic
          - target: darwin-arm64
            runner: macos-latest
            shell: bash
            mode: basic
          - target: darwin-x64
            runner: macos-15-intel
            shell: bash
            mode: basic
          - target: win32-x64
            runner: windows-latest
            shell: bash
            mode: extended
    steps:
      - name: Set up Node (skipped in the Alpine container, which ships its own node/npm)
        if: ${{ !matrix.container }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_PIN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: main-tarball
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conformance-script
      - name: Install from the packed tarball and prove the real binary on this OS
        shell: ${{ matrix.shell }}
        env:
          VERSION: ${{ needs.publish-stage.outputs.version }}
          TARGET: ${{ matrix.target }}
          MODE: ${{ matrix.mode }}
        run: |
          set -eu
          # Fresh, empty global prefix so a stale global install cannot contaminate the proof. On
          # Windows the prefix must be a native path (Git Bash $(pwd) is MSYS-style), so the npm shim
          # and its cmd.exe invocation resolve correctly.
          mkdir -p "$(pwd)/.agentlocks-prefix"
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            PREFIX="$(cygpath -w "$(pwd)/.agentlocks-prefix")"
          else
            PREFIX="$(pwd)/.agentlocks-prefix"
          fi
          export npm_config_prefix="$PREFIX"
          # Force optional deps on even if a runner .npmrc carries omit=optional (which would skip the
          # platform package and let the Bun fallback produce a false pass).
          export npm_config_omit=""
          # --prefer-online busts npm's negative-packument cache so a propagation-lag miss is retried,
          # not served stale. Retry the whole install across the platform package's CDN propagation.
          ok=
          i=1
          while [ "$i" -le 6 ]; do
            if npm install -g ./main.tgz --include=optional --prefer-online; then ok=1; break; fi
            echo "install retry $i (platform package may still be propagating)"; i=$((i + 1)); sleep 10
          done
          [ -n "$ok" ] || { echo "::error::install of main.tgz failed on $TARGET"; exit 1; }

          # Assert this leg proved the intended target: the runner is really this OS/arch/libc and the
          # matching platform package is installed at exactly $VERSION with its binary resolvable. A
          # mis-mapped runner label or wrong libc filter cannot leave a target green-but-unproved. (The
          # conformance run below then proves the installed launcher actually resolves and runs it;
          # globals are not on Node's default path, so resolve via the global root.)
          NODE_PATH="$(npm root -g)" TARGET="$TARGET" VERSION="$VERSION" node -e '
            const t = process.env.TARGET, v = process.env.VERSION;
            let dir = t, libc = null;
            if (dir.endsWith("-musl")) { libc = "musl"; dir = dir.slice(0, -5); }
            const i = dir.indexOf("-"), os = dir.slice(0, i), cpu = dir.slice(i + 1);
            if (os === "linux" && !libc) libc = "glibc";
            const fail = (m) => { console.error("::error::" + m); process.exit(1); };
            if (process.platform !== os) fail("runner platform " + process.platform + " != " + os);
            if (process.arch !== cpu) fail("runner arch " + process.arch + " != " + cpu);
            if (os === "linux") {
              let isMusl = false;
              try { isMusl = !process.report.getReport().header.glibcVersionRuntime; } catch {}
              if ((libc === "musl") !== isMusl) fail("runner libc != " + libc);
            }
            const ver = require("agentlocks-" + t + "/package.json").version;
            if (ver !== v) fail("installed agentlocks-" + t + "@" + ver + " != " + v);
            const exe = process.platform === "win32" ? "agentlocks.exe" : "agentlocks";
            const resolved = require.resolve("agentlocks-" + t + "/bin/" + exe);
            console.log("identity OK: agentlocks-" + t + "@" + ver + " (" + process.platform + "/" + process.arch + (libc ? "/" + libc : "") + ") -> " + resolved);
          '

          # Invoke the npm-installed launcher shim by absolute path (never the platform binary
          # directly, never from PATH). With Bun fallback off, a real lock cycle exercises the
          # runtime-asset extraction that --version/--help bypass.
          if [ "${RUNNER_OS:-}" = "Windows" ]; then BIN="$PREFIX\\agentlocks.cmd"; else BIN="$PREFIX/bin/agentlocks"; fi
          AGENTLOCKS_DISABLE_BUN_FALLBACK=1 node conformance-scenario.mjs "$BIN" "$MODE"

  # The only irreversible, user-visible step, behind the one human approval. The approver sees the
  # full green matrix first. Publishes the SAME main.tgz the matrix installed.
  flip:
    needs: [verify, publish-stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_PIN }}
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: npm install -g "npm@${NPM_PIN}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: main-tarball
      - name: Flip latest (publish main.tgz), idempotent on a pre-existing main@X via integrity
        env:
          VERSION: ${{ needs.publish-stage.outputs.version }}
          OUR_INTEGRITY: ${{ needs.publish-stage.outputs.main_integrity }}
        run: |
          set -eu
          PUB="$(npm view "agentlocks@$VERSION" dist.integrity 2>/dev/null || true)"
          if [ -n "$PUB" ]; then
            # main@X already exists. If its bytes are the ones this run packed, the run already
            # flipped (recovery re-run) -> no-op. Otherwise foreign/stale bytes are live -> hard fail.
            if [ "$PUB" = "$OUR_INTEGRITY" ]; then
              echo "agentlocks@$VERSION already published with this run's bytes; flip is a no-op"
            else
              echo "::error::agentlocks@$VERSION exists with different bytes (ours=$OUR_INTEGRITY pub=$PUB); not overwriting"
              exit 1
            fi
          else
            npm publish ./main.tgz --provenance --access public --ignore-scripts
          fi
      - name: Terminal confirmation (post-flip; warns on propagation lag, hard-fails on wrong version)
        env:
          VERSION: ${{ needs.publish-stage.outputs.version }}
        run: |
          set -eu
          PREFIX="$(pwd)/.confirm-prefix"; mkdir -p "$PREFIX"; export npm_config_prefix="$PREFIX"
          i=1
          while [ "$i" -le 6 ]; do
            # Unpinned install: proves `latest` itself now resolves $VERSION (an exact-version
            # install would pass even if latest still pointed at the old release).
            if npm install -g agentlocks; then
              GOT="$("$PREFIX/bin/agentlocks" --version || true)"
              case "$GOT" in
                *"$VERSION"*) echo "latest resolves $VERSION"; exit 0 ;;
                *) echo "::error::latest resolved a wrong version: $GOT"; exit 1 ;;
              esac
            fi
            echo "post-flip propagation retry $i"; i=$((i + 1)); sleep 10
          done
          echo "::warning::agentlocks@$VERSION not yet resolvable post-flip (propagation lag); not rolling back"

  # Separate from flip so a re-run reaches it even when the flip step no-ops on an already-published
  # main@X. Idempotent.
  release-notes:
    needs: flip
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-binaries
          path: npm
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p dist
          for d in $TARGETS; do
            if [ "$d" = "win32-x64" ]; then
              cp "npm/$d/bin/agentlocks.exe" "dist/agentlocks-$d.exe"
            else
              cp "npm/$d/bin/agentlocks" "dist/agentlocks-$d"
            fi
          done
          V="${GITHUB_REF_NAME#v}"
          awk -v v="## $V" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Release $GITHUB_REF_NAME." > dist/notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/agentlocks-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file dist/notes.md dist/agentlocks-*
          fi
