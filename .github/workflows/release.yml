name: Release

# V2 pipeline (see PRODUCTION_CI_DESIGN_V2.md): build -> publish-stage -> verify (matrix over
# every target) -> flip -> release-notes. The verify matrix is a real `needs:` barrier in front of
# the flip, so no release in which any platform binary fails to install-and-run on its real OS ever
# becomes the `latest` that `npm i -g agentlocks` resolves. Stays tokenless: the flip is a plain
# `npm publish` of the packed main tarball that OIDC trusted publishing already authorizes.

on:
  push:
    tags:
      - "v*"

# latest is a global resource: one release at a time, FIFO, never drop a queued tag, never cancel
# a half-done flip. queue:max requires cancel-in-progress:false.
concurrency:
  group: release
  cancel-in-progress: false

# No workflow-wide privilege. Each job opts in to exactly what it needs.
permissions: {}

jobs:
  # White-box Windows gate: the lock test suite must pass on Windows before anything publishes, and
  # a freshly built win32 binary must pass the extended black-box scenario. Gates publish-stage.
  windows-unit:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: bun test (full lock suite on Windows)
        run: bun test
      - name: Build the win32 binary and run the extended conformance scenario against it
        shell: bash
        run: |
          bun scripts/build-binaries.mjs win32-x64
          node scripts/conformance-scenario.mjs "$(pwd)/npm/win32-x64/bin/agentlocks.exe" extended

  # Cross-compile every target binary into npm/<dir>/bin and hand them on as artifacts. No secrets.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Verify (test + typecheck + lint)
        run: bun run check
      - name: Cross-compile all platform binaries
        run: bun run build:binaries
      - name: Upload platform binaries
        uses: actions/upload-artifact@v4
        with:
          name: platform-binaries
          path: npm/*/bin/*
          if-no-files-found: error
          retention-days: 7

  # OIDC job: run the early guards, publish every platform package under a preflight tag (so an
  # unverified @X is never what `npm i agentlocks-<plat>` resolves; main pins by exact version, so
  # the fanout resolves regardless of tag), guard the published manifests + provenance, inject and
  # assert the optionalDependencies SET, then `npm pack` main into an artifact. Nothing that
  # `npm i -g agentlocks` resolves exists after this job: main is packed, not published.
  publish-stage:
    needs: [build, windows-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.guards.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need history so the merge-base ancestry guard is meaningful
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 24 bundles an older npm. (SHA/version pin: §8.)
      - name: Upgrade npm
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile

      - name: Early guards (ancestry, tag shape, tag == package.json, monotonic version)
        id: guards
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"

          # Tag shape: a plain X.Y.Z release only (the v* trigger also matches v1.2.3-rc.1).
          case "$VERSION" in
            *[!0-9.]* | *..* | .* | *.) echo "::error::bad version shape: $VERSION"; exit 1 ;;
          esac
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version not X.Y.Z: $VERSION"; exit 1; }

          # Tag must match the manifest.
          PKG="$(node -p "require('./package.json').version")"
          [ "$VERSION" = "$PKG" ] || { echo "::error::tag $VERSION != package.json $PKG"; exit 1; }

          # Tagged commit must be on the protected branch (a v* tag can point anywhere).
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tagged commit is not on origin/main"; exit 1; }

          # Monotonic version, compared as a numeric tuple (not string, not semver: not a dependency).
          # below-max: fail. equal-max: pass only if the published bytes provenance-match this run
          # (a recovery re-run, which the flip then no-ops); the flip enforces that, so here equal is
          # allowed through and the flip is the authority. strictly-greater: pass. empty: first release.
          node -e '
            const v = process.env.VERSION.split(".").map(Number);
            let versions = [];
            try { versions = JSON.parse(require("child_process").execSync("npm view agentlocks versions --json", {stdio:["ignore","pipe","ignore"]}).toString()); } catch { versions = []; }
            if (!Array.isArray(versions)) versions = [versions].filter(Boolean);
            const tuples = versions.map(s => String(s).split(".").map(Number)).filter(t => t.length === 3 && t.every(Number.isFinite));
            const cmp = (a,b) => a[0]-b[0] || a[1]-b[1] || a[2]-b[2];
            const max = tuples.sort(cmp).pop();
            if (max && cmp(v, max) < 0) { console.error("::error::version " + process.env.VERSION + " is below the published max " + max.join(".")); process.exit(1); }
          '
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ github.ref_name }}

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          name: platform-binaries
          path: npm

      - name: Publish platform packages under the preflight tag (skip-if-exists, provenance)
        env:
          VERSION: ${{ steps.guards.outputs.version }}
        run: |
          set -eu
          for d in darwin-arm64 darwin-x64 linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl win32-x64; do
            pkg="agentlocks-$d"
            if [ "$(npm view "$pkg@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "$pkg@$VERSION already published, skipping"
            else
              ( cd "npm/$d" \
                && npm pkg set "version=$VERSION" \
                && npm publish --provenance --access public --tag preflight )
            fi
          done

      - name: Guard published platform manifests and provenance
        env:
          VERSION: ${{ steps.guards.outputs.version }}
        run: |
          set -eu
          # Manifest guard: every platform package must exist at $VERSION with the os/cpu(/libc) it
          # claims and carry its binary file. Provenance guard: each must carry a --provenance
          # attestation tying it to THIS repo, so a skip-if-exists reuse cannot accept a foreign or
          # squatted package. The exact attestation-verify command moves with npm/gh: `npm audit
          # signatures` over a temp install is the current portable form. Confirm at bootstrap and
          # hard-fail on mismatch (this guard fails the release; it never silently continues).
          for d in darwin-arm64 darwin-x64 linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl win32-x64; do
            pkg="agentlocks-$d"
            got="$(npm view "$pkg@$VERSION" version 2>/dev/null || true)"
            [ "$got" = "$VERSION" ] || { echo "::error::$pkg@$VERSION missing after publish"; exit 1; }
          done
          tmp="$(mktemp -d)"
          ( cd "$tmp" && npm init -y >/dev/null 2>&1 \
            && for d in darwin-arm64 darwin-x64 linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl win32-x64; do \
                 npm install --no-save --force "agentlocks-$d@$VERSION" >/dev/null 2>&1 || true; \
               done \
            && npm audit signatures ) || { echo "::error::provenance/signature guard failed"; exit 1; }

      - name: Inject optionalDependencies into main and assert the exact set
        env:
          VERSION: ${{ steps.guards.outputs.version }}
        run: |
          set -eu
          npm pkg set \
            "optionalDependencies.agentlocks-darwin-arm64=$VERSION" \
            "optionalDependencies.agentlocks-darwin-x64=$VERSION" \
            "optionalDependencies.agentlocks-linux-x64=$VERSION" \
            "optionalDependencies.agentlocks-linux-arm64=$VERSION" \
            "optionalDependencies.agentlocks-linux-x64-musl=$VERSION" \
            "optionalDependencies.agentlocks-linux-arm64-musl=$VERSION" \
            "optionalDependencies.agentlocks-win32-x64=$VERSION"
          node -e '
            const want = ["darwin-arm64","darwin-x64","linux-x64","linux-arm64","linux-x64-musl","linux-arm64-musl","win32-x64"].map(s => "agentlocks-" + s);
            const od = require("./package.json").optionalDependencies || {};
            const got = Object.keys(od).sort();
            const exp = [...want].sort();
            if (got.length !== exp.length || got.some((k,i) => k !== exp[i])) { console.error("::error::optionalDependencies set mismatch: " + got.join(",")); process.exit(1); }
            for (const k of want) if (od[k] !== process.env.VERSION) { console.error("::error::" + k + " pinned at " + od[k] + " not " + process.env.VERSION); process.exit(1); }
          '

      - name: Pack main into a tarball artifact (NOT published here)
        run: |
          set -eu
          npm pack
          mv agentlocks-*.tgz main.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: main-tarball
          path: main.tgz
          if-no-files-found: error
          retention-days: 7

  # THE GATE. One leg per target on its native runner. No id-token here: a job that runs freshly
  # built binaries must not hold the publish credential. fail-fast:false so every target reports.
  verify:
    needs: publish-stage
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            shell: bash
            mode: basic
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            shell: bash
            mode: basic
          - target: linux-x64-musl
            runner: ubuntu-latest
            container: node:22-alpine
            shell: sh
            mode: basic
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            container: node:22-alpine
            shell: sh
            mode: basic
          - target: darwin-arm64
            runner: macos-latest
            shell: bash
            mode: basic
          - target: darwin-x64
            runner: macos-15-intel
            shell: bash
            mode: basic
          - target: win32-x64
            runner: windows-latest
            shell: bash
            mode: extended
    steps:
      - uses: actions/checkout@v6 # provides scripts/conformance-scenario.mjs at the tagged commit
      - name: Set up Node (skipped in the Alpine container, which ships its own node/npm)
        if: ${{ !matrix.container }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: main-tarball
      - name: Install from the packed tarball and prove the real binary on this OS
        shell: ${{ matrix.shell }}
        env:
          VERSION: ${{ needs.publish-stage.outputs.version }}
          TARGET: ${{ matrix.target }}
          MODE: ${{ matrix.mode }}
          # Force optional deps on even if a runner .npmrc carries omit=optional (which would skip the
          # platform package and let the Bun fallback produce a false pass).
          npm_config_omit: ""
        run: |
          set -eu
          # --prefer-online busts npm's negative-packument cache so a propagation-lag miss is retried,
          # not served stale. Retry the whole install across the platform package's CDN propagation.
          ok=
          for i in 1 2 3 4 5 6; do
            if npm install -g ./main.tgz --include=optional --prefer-online; then ok=1; break; fi
            echo "install retry $i (platform package may still be propagating)"; sleep 10
          done
          [ -n "$ok" ] || { echo "::error::install of main.tgz failed on $TARGET"; exit 1; }

          # Invoke the npm-installed launcher shim by absolute path (never the platform binary
          # directly, never from PATH), so a stale global install cannot contaminate the proof.
          if [ "${RUNNER_OS:-}" = "Windows" ]; then BIN="$(npm prefix -g)/agentlocks"; else BIN="$(npm prefix -g)/bin/agentlocks"; fi

          # Assert this leg proved the intended target: the launcher must resolve exactly
          # agentlocks-$TARGET@$VERSION, so a mis-mapped runner label or wrong libc filter cannot
          # leave a target green-but-unproved.
          AGENTLOCKS_DISABLE_BUN_FALLBACK=1 node -e '
            const t = process.env.TARGET, v = process.env.VERSION;
            const pkg = "agentlocks-" + t;
            const bin = process.platform === "win32" ? "agentlocks.exe" : "agentlocks";
            const resolved = require.resolve(pkg + "/bin/" + bin);
            const ver = require(pkg + "/package.json").version;
            if (ver !== v) { console.error("::error::resolved " + pkg + "@" + ver + " not @" + v); process.exit(1); }
            console.log("identity OK: " + pkg + "@" + ver + " -> " + resolved);
          '

          # Real lock cycle against the prebuilt binary, Bun fallback off. (--version/--help bypass
          # the runtime-asset extraction that is a compiled single-file binary's real failure mode.)
          AGENTLOCKS_DISABLE_BUN_FALLBACK=1 node scripts/conformance-scenario.mjs "$BIN" "$MODE"

  # The only irreversible, user-visible step, behind the one human approval. The approver sees the
  # full green matrix first. Publishes the SAME main.tgz the matrix installed: the live bytes are the
  # bytes proven on every target.
  flip:
    needs: [verify, publish-stage]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm
        run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: main-tarball
      - name: Flip latest (publish main.tgz), with provenance-recovery on a pre-existing main@X
        env:
          VERSION: ${{ needs.publish-stage.outputs.version }}
        run: |
          set -eu
          PUBLISHED="$(npm view "agentlocks@$VERSION" version 2>/dev/null || true)"
          if [ "$PUBLISHED" = "$VERSION" ]; then
            # main@X already exists. Verify its provenance matches THIS repo/run: a match means this
            # run already flipped (a recovery re-run), so no-op; a mismatch is foreign/stale bytes and
            # must hard-fail. Until the exact attestation-verify command is confirmed at bootstrap,
            # hard-fail unconditionally rather than risk treating foreign bytes as ours.
            echo "::error::agentlocks@$VERSION already published; provenance-recovery is a confirm-at-bootstrap step. Investigate before re-running."
            exit 1
          fi
          npm publish ./main.tgz --provenance --access public
      - name: Terminal confirmation (post-flip; warns on propagation lag, hard-fails on wrong version)
        env:
          VERSION: ${{ needs.publish-stage.outputs.version }}
        run: |
          set -eu
          for i in 1 2 3 4 5 6; do
            if npm install -g "agentlocks@$VERSION"; then
              GOT="$(agentlocks --version || true)"
              case "$GOT" in
                *"$VERSION"*) echo "latest resolves $VERSION"; exit 0 ;;
                *) echo "::error::latest resolved a wrong version: $GOT"; exit 1 ;;
              esac
            fi
            echo "post-flip propagation retry $i"; sleep 10
          done
          echo "::warning::agentlocks@$VERSION not yet resolvable post-flip (propagation lag); not rolling back"

  # Separate from flip so a re-run reaches it even when the flip step provenance-no-ops on an
  # already-published main@X. Idempotent.
  release-notes:
    needs: flip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: platform-binaries
          path: npm
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for d in darwin-arm64 darwin-x64 linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl; do
            cp "npm/$d/bin/agentlocks" "dist/agentlocks-$d"
          done
          cp "npm/win32-x64/bin/agentlocks.exe" "dist/agentlocks-win32-x64.exe"
          V="${GITHUB_REF_NAME#v}"
          awk -v v="## $V" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Release $GITHUB_REF_NAME." > dist/notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/agentlocks-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file dist/notes.md dist/agentlocks-*
          fi
