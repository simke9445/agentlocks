name: Release

on:
  push:
    tags:
      - "v*"

# OIDC trusted publishing — no npm token anywhere.
#   id-token: write  -> lets the runner mint the short-lived OIDC token npm trusts
#   contents: write  -> only for creating the GitHub Release at the end
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Manual-approval gate. The `release` GitHub Environment has required reviewers,
    # so a tag push pauses here until approved. The same environment name is set in
    # each package's npm trusted-publisher config.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 24 bundles an older npm.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Derive version from tag and verify it matches package.json
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($VERSION) != package.json ($PKG)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (test + typecheck + lint)
        run: bun run check

      - name: Build all four platform binaries
        run: bun run build:binaries

      # Platform packages publish first. Versions are stamped from the tag, so the
      # four npm/*/package.json files are never hand-bumped. Each publish is skipped
      # when that version is already on npm, so the whole job is safe to re-run after
      # a partial failure (published versions are immutable). --provenance forces the
      # attestation.
      - name: Publish platform packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for d in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            pkg="agentlocks-$d"
            if [ "$(npm view "$pkg@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$pkg@$VERSION already published, skipping"
            else
              ( cd "npm/$d" \
                && npm pkg set "version=$VERSION" \
                && npm publish --provenance --access public )
            fi
          done

      # Inject optionalDependencies into the main manifest (NOT committed), then
      # publish. A plain checkout never declares unpublished deps, so frozen installs
      # always resolve; only the published tarball carries these. Skipped if already
      # published, so a re-run after a partial failure is safe.
      - name: Publish main package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$(npm view "agentlocks@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "agentlocks@$VERSION already published, skipping"
          else
            npm pkg set \
              "optionalDependencies.agentlocks-darwin-arm64=$VERSION" \
              "optionalDependencies.agentlocks-darwin-x64=$VERSION" \
              "optionalDependencies.agentlocks-linux-x64=$VERSION" \
              "optionalDependencies.agentlocks-linux-arm64=$VERSION"
            npm publish --provenance --access public
          fi

      # Attach the binaries under unique names — all four share the basename
      # "agentlocks", which collides as release assets (a file's basename is the asset
      # name; `#label` only sets the display label). Notes come from the matching
      # CHANGELOG section. Idempotent: a re-run clobbers assets on the existing release
      # instead of failing.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for d in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            cp "npm/$d/bin/agentlocks" "dist/agentlocks-$d"
          done
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Release $VERSION." > dist/notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/agentlocks-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file dist/notes.md dist/agentlocks-*
          fi

  # Clean-room end-to-end gate: install the just-published version from npm with no
  # Bun on the box, exactly like the manual "verify on a clean machine" step. Catches
  # a broken binary or mis-wired optionalDependency before you announce the release.
  verify:
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install published package and check it runs
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          for i in 1 2 3 4 5 6; do
            npm install -g "agentlocks@$VERSION" && break
            echo "registry not propagated yet, retry $i/6"; sleep 10
          done
          GOT="$(agentlocks --version)"
          echo "agentlocks --version -> $GOT"
          case "$GOT" in *"$VERSION"*) echo "OK" ;; *) echo "::error::version mismatch"; exit 1 ;; esac
