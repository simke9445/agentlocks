name: windows-unit

# White-box Windows gate (docs/production_ci_design.md section 4.6), shared by ci.yml (PR /
# push gate) and release.yml (publish gate) via `uses: ./.github/workflows/windows-unit.yml`. The
# full lock suite must pass on Windows, and a freshly built win32 binary must pass the extended
# black-box conformance scenario (rename-replace, conflict, reclaim, git-index cycle, backslash
# path). Configure as a required status check (branch protection) on PRs so the Windows port cannot
# regress between releases.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-unit:
    name: windows-unit (bun test + conformance)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test (full lock suite on Windows)
        # --timeout above Bun's 5s default: the ci-scripts integration tests spawn several Node CLIs,
        # and cold process spawns on the Windows runner can push a multi-spawn test past 5s (observed
        # a 9.4s run), flaking this gate. The work is real, just slow to spawn; give it headroom.
        run: bun test --timeout 30000

      - name: Build the win32 binary and run the extended conformance scenario
        shell: bash
        run: |
          bun scripts/build-binaries.mjs win32-x64
          node scripts/conformance-scenario.mjs "$(pwd)/npm/win32-x64/bin/agentlocks.exe" extended
