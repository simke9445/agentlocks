name: windows-unit

# White-box Windows gate (docs/production_ci_design.md section 4.6), shared by ci.yml (PR /
# push gate) and release.yml (publish gate) via `uses: ./.github/workflows/windows-unit.yml`. The
# full lock suite must pass on Windows, and a freshly packed Node bundle must install globally via
# the npm cmd-shim (`agentlocks.cmd` -> `node ...\dist\agentlocks.mjs`) and pass the extended
# black-box conformance scenario (rename-replace, conflict, reclaim, git-index cycle, backslash
# path) plus the `.ts`-config engine contract. This is the codex HIGH: npm cmd-shim + `.mjs` exec
# on Windows. Configure as a required status check (branch protection) on PRs so the Windows port
# cannot regress between releases.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-unit:
    name: windows-unit (bun test + bundle conformance)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test (full lock suite on Windows)
        # --timeout above Bun's 5s default: the ci-scripts integration tests spawn several Node CLIs,
        # and cold process spawns on the Windows runner can push a multi-spawn test past 5s (observed
        # a 9.4s run), flaking this gate. The work is real, just slow to spawn; give it headroom.
        run: bun test --timeout 30000

      # Pack the exact tarball `npm publish` would upload (prepack -> `bun run build` ->
      # dist/agentlocks.mjs), install it globally, and prove the npm cmd-shim runs the bundle under
      # Node with no Bun on PATH. `npm i -g --prefix` writes <prefix>\agentlocks.cmd (`node
      # ...\dist\agentlocks.mjs %*`); the conformance harness detects the non-.exe invocation and
      # spawns it via a shell.
      - name: Pack + install the bundle and run the extended conformance scenario
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm pack
          if ($LASTEXITCODE -ne 0) { throw "npm pack failed ($LASTEXITCODE)" }
          $tgz = (Get-ChildItem -Filter "agentlocks-*.tgz" | Select-Object -First 1).FullName
          if (-not $tgz) { throw "no tarball produced by npm pack" }
          $prefix = Join-Path $env:RUNNER_TEMP "al-prefix"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          npm i -g --prefix $prefix $tgz
          if ($LASTEXITCODE -ne 0) { throw "npm install failed ($LASTEXITCODE)" }
          $bin = Join-Path $prefix "agentlocks.cmd"
          if (-not (Test-Path $bin)) { Get-ChildItem $prefix; throw "bin missing at $bin" }
          & $bin --version
          if ($LASTEXITCODE -ne 0) { throw "agentlocks --version failed ($LASTEXITCODE)" }
          node scripts/conformance-scenario.mjs "$bin" extended
          if ($LASTEXITCODE -ne 0) { throw "conformance failed ($LASTEXITCODE)" }
          node scripts/ts-config-smoke.mjs "$bin"
          if ($LASTEXITCODE -ne 0) { throw "ts-config-smoke failed ($LASTEXITCODE)" }
