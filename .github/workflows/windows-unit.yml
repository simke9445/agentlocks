name: windows-unit

# White-box Windows gate (docs/production_ci_design.md section 4.6), shared by ci.yml (PR / push
# gate) and release.yml (publish gate) via `uses: ./.github/workflows/windows-unit.yml`. The full
# lock suite must pass on Windows -- the platform whose path / spawn / file-rename semantics differ
# most from the POSIX runners the suite is written on. Configure as a required status check (branch
# protection) on PRs so the Windows port cannot regress between releases.
#
# Black-box Windows proof (the packed bundle installs via the npm cmd-shim and passes extended
# conformance) lives in conformance.yml's windows-latest legs, which both callers also run -- so this
# gate is deliberately white-box only, with no overlap. It needs no packed tarball, hence runs fully
# in parallel with the pack -> conformance chain.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-unit:
    name: windows-unit (full lock suite)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test (full lock suite on Windows)
        # --timeout above Bun's 5s default: the ci-scripts integration tests spawn several Node CLIs,
        # and cold process spawns on the Windows runner can push a multi-spawn test past 5s (observed
        # a 9.4s run), flaking this gate. The work is real, just slow to spawn; give it headroom.
        run: bun test --timeout 30000
