<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agentlocks collision demo</title>
  <desc id="desc">Two terminal panes show Codex acquiring a lock for src/auth.ts and Claude Code receiving a lock conflict with the owner, reason, and next command.</desc>
  <rect width="1280" height="720" fill="#0b1020"/>
  <rect x="40" y="40" width="1200" height="640" rx="18" fill="#101827" stroke="#314158" stroke-width="2"/>
  <rect x="40" y="40" width="1200" height="58" rx="18" fill="#182235"/>
  <circle cx="74" cy="69" r="8" fill="#ff5f57"/>
  <circle cx="100" cy="69" r="8" fill="#ffbd2e"/>
  <circle cx="126" cy="69" r="8" fill="#28c840"/>
  <text x="640" y="76" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#e5edf8">Agentlocks: collision surfaces before edits overlap</text>

  <rect x="72" y="126" width="548" height="506" rx="12" fill="#0d1424" stroke="#2d3b52"/>
  <rect x="660" y="126" width="548" height="506" rx="12" fill="#0d1424" stroke="#2d3b52"/>
  <rect x="72" y="126" width="548" height="44" rx="12" fill="#12213a"/>
  <rect x="660" y="126" width="548" height="44" rx="12" fill="#12213a"/>
  <text x="96" y="154" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#7dd3fc">Codex lane</text>
  <text x="684" y="154" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#c4b5fd">Claude Code lane</text>

  <text x="96" y="210" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#9ca3af">$ agentlocks acquire src/auth.ts \</text>
  <text x="96" y="240" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#9ca3af">  --reason "Codex refactors login flow" \</text>
  <text x="96" y="270" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#9ca3af">  --id-only</text>
  <text x="96" y="334" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#86efac">lock_20260604T155313Z_139a36cf</text>
  <rect x="96" y="392" width="396" height="74" rx="10" fill="#10251b" stroke="#1f7a46"/>
  <text x="120" y="424" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#86efac">Lease held</text>
  <text x="120" y="452" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#bbf7d0">src/auth.ts</text>
  <text x="120" y="508" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9ca3af">$ agent edits src/auth.ts ...</text>

  <text x="684" y="210" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#9ca3af">$ agentlocks acquire src/auth.ts \</text>
  <text x="684" y="240" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#9ca3af">  --reason "Claude reviews same login file"</text>
  <rect x="684" y="318" width="474" height="214" rx="12" fill="#2a1417" stroke="#f97373"/>
  <text x="708" y="354" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#fecaca">lock conflict: src/auth.ts</text>
  <text x="708" y="390" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#fecaca">held by: codex:&lt;session&gt;</text>
  <text x="708" y="426" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#fecaca">reason: Codex refactors login flow</text>
  <text x="708" y="462" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#fecaca">status: held</text>
  <text x="708" y="498" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#fde68a">next: work on unrelated unlocked files, then retry</text>

  <rect x="212" y="596" width="856" height="42" rx="21" fill="#16263d" stroke="#3b82f6"/>
  <text x="640" y="623" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#dbeafe">Second agent gets owner, reason, and next command instead of a silent overwrite.</text>
</svg>
